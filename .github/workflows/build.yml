name: Build test apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create / patch native projects
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          flutter --version
          bash tool/ci_step.sh setup python3 tool/setup_platforms.py

      - name: Dependencies, icons, localizations
        run: |
          bash tool/ci_step.sh pub-get flutter pub get
          bash tool/ci_step.sh icons dart run flutter_launcher_icons
          bash tool/ci_step.sh gen-l10n flutter gen-l10n

      - name: Analyze
        run: bash tool/ci_step.sh analyze flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: bash tool/ci_step.sh test flutter test

      - name: Build APK (one file per CPU type)
        run: |
          bash tool/ci_step.sh build-apk flutter build apk --release --split-per-abi \
            --dart-define=ADMOB_ANDROID_BANNER=${{ secrets.ADMOB_ANDROID_BANNER }} \
            --dart-define=ADMOB_ANDROID_INTERSTITIAL=${{ secrets.ADMOB_ANDROID_INTERSTITIAL }} \
            --dart-define=ADMOB_ANDROID_NATIVE=${{ secrets.ADMOB_ANDROID_NATIVE }}
          ls -la build/app/outputs/flutter-apk/

      - name: Build App Bundle (for Google Play)
        run: bash tool/ci_step.sh build-aab flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Commit generated native projects (first run only)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Android project [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi

  ios:
    name: iOS (simulator app + unsigned device build)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create / patch native project
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          python3 tool/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter gen-l10n
          bash tool/ci_step.sh ios-config flutter build ios --config-only --no-codesign
          python3 tool/setup_platforms.py --patch
          cd ios && bash ../tool/ci_step.sh pod-install pod install --repo-update

      - name: Build for iOS Simulator
        run: |
          bash tool/ci_step.sh build-ios-sim flutter build ios --simulator --debug
          cd build/ios/iphonesimulator && zip -qry ../../../ios-simulator-Runner.app.zip Runner.app

      - name: Build for device (unsigned)
        run: |
          bash tool/ci_step.sh build-ios-device flutter build ios --release --no-codesign \
            --dart-define=ADMOB_IOS_BANNER=${{ secrets.ADMOB_IOS_BANNER }} \
            --dart-define=ADMOB_IOS_INTERSTITIAL=${{ secrets.ADMOB_IOS_INTERSTITIAL }} \
            --dart-define=ADMOB_IOS_NATIVE=${{ secrets.ADMOB_IOS_NATIVE }}
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            ios-simulator-Runner.app.zip
            ios-unsigned.ipa
          retention-days: 30

      - name: Commit generated iOS project (first run only)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if ! git diff --cached --quiet; then
            git commit -m "Add generated iOS project [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
