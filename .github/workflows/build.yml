name: Build test apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h / && free -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create / patch native projects
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          flutter --version
          bash tool/ci_step.sh setup python3 tool/setup_platforms.py

      - name: Dependencies, icons, localizations
        run: |
          bash tool/ci_step.sh pub-get flutter pub get
          bash tool/ci_step.sh icons dart run flutter_launcher_icons
          bash tool/ci_step.sh gen-l10n flutter gen-l10n

      - name: Analyze
        run: bash tool/ci_step.sh analyze flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: bash tool/ci_step.sh test flutter test

      - name: Build APK (one file per CPU type)
        run: |
          bash tool/ci_step.sh build-apk flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --dart-define=ADMOB_ANDROID_BANNER=${{ secrets.ADMOB_ANDROID_BANNER }} \
            --dart-define=ADMOB_ANDROID_INTERSTITIAL=${{ secrets.ADMOB_ANDROID_INTERSTITIAL }} \
            --dart-define=ADMOB_ANDROID_NATIVE=${{ secrets.ADMOB_ANDROID_NATIVE }}
          ls -la build/app/outputs/flutter-apk/

      - name: Build App Bundle (for Google Play)
        run: bash tool/ci_step.sh build-aab flutter build appbundle --release --target-platform android-arm64,android-arm

      - name: Publish logs if a step was killed
        if: failure()
        run: |
          df -h / ; free -h ; dmesg 2>/dev/null | tail -20 || true
          cd "$RUNNER_TEMP" && mkdir -p ci-logs && cd ci-logs && echo "run $GITHUB_RUN_ID (failure step)" > README.txt
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "logs $GITHUB_RUN_ID" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs-${GITHUB_JOB} || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish APKs to the apk-latest branch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/apk-out" && rm -rf "$out" && mkdir -p "$out" && cd "$out"
          cp "$GITHUB_WORKSPACE"/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk VoiceRealtimeTranslater-arm64.apk
          cp "$GITHUB_WORKSPACE"/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk VoiceRealtimeTranslater-armv7.apk
          echo "Built from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.txt
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "APKs from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/apk-latest

      - name: Commit generated native projects (first run only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Android project [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi

  ios:
    name: iOS (simulator app + unsigned device build)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create / patch native project
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          python3 tool/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter gen-l10n
          bash tool/ci_step.sh ios-config flutter build ios --config-only --no-codesign
          python3 tool/setup_platforms.py --patch
          cd ios && bash ../tool/ci_step.sh pod-install pod install --repo-update

      - name: Build for iOS Simulator
        run: |
          bash tool/ci_step.sh build-ios-sim flutter build ios --simulator --debug
          cd build/ios/iphonesimulator && zip -qry ../../../ios-simulator-Runner.app.zip Runner.app

      - name: Build for device (unsigned)
        run: |
          bash tool/ci_step.sh build-ios-device flutter build ios --release --no-codesign \
            --dart-define=ADMOB_IOS_BANNER=${{ secrets.ADMOB_IOS_BANNER }} \
            --dart-define=ADMOB_IOS_INTERSTITIAL=${{ secrets.ADMOB_IOS_INTERSTITIAL }} \
            --dart-define=ADMOB_IOS_NATIVE=${{ secrets.ADMOB_IOS_NATIVE }}
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            ios-simulator-Runner.app.zip
            ios-unsigned.ipa
          retention-days: 30

      - name: Publish iOS builds to the ios-latest branch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/ios-out" && rm -rf "$out" && mkdir -p "$out"
          cp ios-simulator-Runner.app.zip ios-unsigned.ipa "$out"/ && cd "$out"
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "iOS builds from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ios-latest

      - name: Commit generated iOS project (first run only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if ! git diff --cached --quiet; then
            git commit -m "Add generated iOS project [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
